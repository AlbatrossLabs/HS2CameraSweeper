<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Same look as the Camera Routes / Studio Browser images: navy, faint grid, cyan + pink glows,
     gradient word + neon plate, pill chips. The pictures are three real Camera Sweep shots
     (CamSweep_cam01..03), dealt out like prints. */
  :root {
    --bg: #0a0d18; --border: rgba(255,255,255,.10);
    --text: #e8ecf8; --muted: #8b95b5; --cyan: #22d3ee; --pink: #f472b6; --neon: #6ee7b7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Inter', 'Inter Display', sans-serif; }
  .stage { position: relative; overflow: hidden; background: var(--bg); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: linear-gradient(90deg, rgba(0,0,0,.9), rgba(0,0,0,.25)); }
  .glow { position: absolute; border-radius: 50%; filter: blur(60px); }
  .glow.c { background: rgba(34,211,238,.20); }
  .glow.p { background: rgba(244,114,182,.34); }

  .brand { position: absolute; display: flex; flex-direction: column; z-index: 5; }
  .wordmark { display: flex; align-items: center; gap: 18px; }
  .camera { font-family: 'Poppins', sans-serif; font-weight: 800; letter-spacing: -1px; line-height: 1;
    background: linear-gradient(90deg, var(--cyan), #a78bfa 55%, var(--pink)); -webkit-background-clip: text; color: transparent; }
  .plate { display: flex; align-items: center; border: 2px solid var(--neon); border-radius: 14px;
    background: rgba(110,231,183,.08); box-shadow: 0 0 22px rgba(110,231,183,.35), inset 0 0 18px rgba(110,231,183,.12); }
  .sweep { font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--neon); letter-spacing: 1px; line-height: 1;
    text-shadow: 0 0 14px rgba(110,231,183,.55); }
  .underline { height: 4px; border-radius: 2px; margin-top: 16px; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
  .tagline { color: var(--text); margin-top: 16px; line-height: 1.35; }
  .tagline b { color: #fff; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chip { font-size: 15px; font-weight: 600; color: var(--text); padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255,255,255,.04); }
  .chip.on { color: #0a0d18; background: var(--neon); border-color: var(--neon); }
  .chip.pk { color: #ffd6ea; border-color: rgba(244,114,182,.6); background: rgba(244,114,182,.12); }
  .by { font-size: 13px; letter-spacing: 2.5px; color: var(--muted); font-weight: 600; z-index: 5; }
  .by b { color: var(--text); }

  /* the three shots */
  .prints { position: absolute; z-index: 3; }
  .shot { position: absolute; border-radius: 14px; overflow: hidden; background: #0d1120;
    border: 1.5px solid rgba(255,255,255,.16); box-shadow: 0 22px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.5); }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shot::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.07), transparent 30%); }
  .shot.live { border: 2.5px solid var(--neon); box-shadow: 0 0 34px rgba(110,231,183,.45), 0 22px 60px rgba(0,0,0,.7); }
  .shot .cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 26px 12px 9px; font-weight: 600; color: #e8ecf8;
    background: linear-gradient(transparent, rgba(8,10,20,.94)); white-space: nowrap; }
  .shot .cap span { color: var(--neon); }
  .shot .cam { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; font-weight: 800;
    padding: 4px 9px 4px 7px; border-radius: 8px; color: #e8ecf8; background: rgba(10,13,24,.82); border: 1px solid rgba(255,255,255,.16); }
  .shot.live .cam { color: #0a0d18; background: var(--neon); border-color: var(--neon); }
  .shot .ok { position: absolute; right: 10px; top: 10px; z-index: 2; border-radius: 7px; background: var(--neon);
    display: grid; place-items: center; box-shadow: 0 0 12px rgba(110,231,183,.75); }
  /* corner brackets, like a viewfinder */
  .shot .vf { position: absolute; inset: 9px; z-index: 1; pointer-events: none;
    background:
      linear-gradient(#fff, #fff) left top / 16px 2px no-repeat, linear-gradient(#fff, #fff) left top / 2px 16px no-repeat,
      linear-gradient(#fff, #fff) right top / 16px 2px no-repeat, linear-gradient(#fff, #fff) right top / 2px 16px no-repeat,
      linear-gradient(#fff, #fff) left bottom / 16px 2px no-repeat, linear-gradient(#fff, #fff) left bottom / 2px 16px no-repeat,
      linear-gradient(#fff, #fff) right bottom / 16px 2px no-repeat, linear-gradient(#fff, #fff) right bottom / 2px 16px no-repeat;
    opacity: .45; }

  /* the Camera Sweep progress bar, as the plugin draws it */
  .bar { position: absolute; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 10px; border: 1.5px solid rgba(110,231,183,.7); background: #0F1115;
    box-shadow: 0 0 24px rgba(110,231,183,.15), 0 12px 36px rgba(0,0,0,.55); color: #E6E8EE; font-size: 12px; }
  .bar b { color: #58A6FF; font-weight: 700; white-space: nowrap; }
  .bar .track { flex: 1; height: 10px; border-radius: 5px; background: #0B0D10; border: 1px solid #262A33; overflow: hidden; }
  .bar .track i { display: block; height: 100%; background: #6EE7B7; border-radius: 5px; box-shadow: 0 0 10px rgba(110,231,183,.7); }
  .bar .n { white-space: nowrap; font-weight: 600; }
  .bar .n span { color: #8B91A1; font-weight: 500; }
  .bar .x { padding: 3px 9px; border-radius: 6px; border: 1px solid #262A33; background: #171A21; font-size: 11px; }

  /* README banner, 1600 x 400 */
  .banner { width: 1600px; height: 400px; }
  .banner .glow.c { width: 520px; height: 300px; left: -120px; top: -80px; }
  .banner .glow.p { width: 760px; height: 420px; right: -60px; top: -10px; }
  .banner .brand { left: 64px; top: 48px; width: 640px; }
  .banner .camera { font-size: 80px; }
  .banner .plate { height: 76px; padding: 0 20px; }
  .banner .sweep { font-size: 54px; }
  .banner .underline { width: 360px; }
  .banner .tagline { font-size: 21px; }
  .banner .by { position: absolute; left: 64px; bottom: 26px; }
  .banner .prints { left: 800px; top: 0; width: 800px; height: 400px; }
  .banner .shot .cap { font-size: 12px; }
  .banner .shot .cam { font-size: 11.5px; }
  .banner .bar { left: 860px; top: 348px; width: 660px; }

  /* Discord, 1200 x 800 (3:2) */
  .discord { width: 1200px; height: 800px; }
  .discord .glow.c { width: 600px; height: 420px; left: -160px; top: -120px; }
  .discord .glow.p { width: 1000px; height: 520px; right: -200px; top: 330px; }
  .discord .brand { left: 60px; top: 64px; width: 640px; }
  .discord .camera { font-size: 92px; }
  .discord .plate { height: 88px; padding: 0 22px; }
  .discord .sweep { font-size: 64px; }
  .discord .underline { width: 400px; }
  .discord .tagline { font-size: 24px; max-width: 600px; }
  .discord .chips { max-width: 620px; }
  .discord .by { position: absolute; left: 60px; bottom: 24px; }
  .discord .prints { left: 0; top: 0; width: 1200px; height: 800px; }
  .discord .shot .cap { font-size: 13.5px; }
  .discord .shot .cam { font-size: 12.5px; }
  .discord .bar { left: 60px; top: 698px; width: 1080px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const layout = new URLSearchParams(location.search).get('layout') || 'banner';
const D = layout === 'discord';

const brand = (tag) => `
  <div class="brand">
    <div class="wordmark"><div class="camera">CAMERA</div><div class="plate"><div class="sweep">SWEEP</div></div></div>
    <div class="underline"></div>
    <div class="tagline">${tag}</div>
    <div class="chips">
      <div class="chip on">Every camera, one click</div><div class="chip">Outfits · poses · faces</div>
      <div class="chip">PNG · WebP · JPG</div><div class="chip">Transparent backgrounds</div>
      <div class="chip pk">Video via VideoExport</div>
    </div>
  </div>`;
const by = `<div class="by">HONEY SELECT 2 STUDIO PLUGINS · <b>ALBATROSS LABS</b></div>`;

const camIcon = (fill) => `<svg width="15" height="12" viewBox="0 0 15 12"><rect x="0" y="2.5" width="15" height="9.5" rx="2.5" fill="${fill}"/><rect x="3" y="0" width="5" height="3" rx="1" fill="${fill}"/><circle cx="7.5" cy="7.2" r="3" fill="${fill === '#0a0d18' ? '#6ee7b7' : '#0a0d18'}"/></svg>`;
const check = (s) => `<svg width="${s * .6}" height="${s * .6}" viewBox="0 0 12 12"><path d="M2.2 6.3 L4.8 8.8 L9.8 3.4" stroke="#0a0d18" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// The three real shots. pos = horizontal object-position, so the portrait crop keeps her in frame.
const shots = [
  { src: 'CamSweep_cam01.jpg', pos: '48%', name: 'cam01_<span>bunny_full</span>', zoom: 1.25 },
  { src: 'CamSweep_cam02.jpg', pos: '54%', name: 'cam02_<span>bunny_close</span>' },
  { src: 'CamSweep_cam03.jpg', pos: '47%', name: 'cam03_<span>bunny_peace</span>', live: true },
];
// x, y, w, h, rotation for each print, per layout
const place = D
  ? [ [62, 404, 330, 272, -2], [436, 396, 330, 272, 1.5], [808, 402, 330, 272, -1] ]
  : [ [860, 46, 210, 280, -5], [1088, 30, 210, 280, 3], [1310, 40, 210, 280, -2] ];
const okSize = D ? 26 : 22;
const prints = `<div class="prints">${shots.map((s, i) => {
  const [x, y, w, h, r] = place[i];
  const left = D ? x : x - 800;
  return `<div class="shot ${s.live ? 'live' : ''}" style="left:${left}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${r}deg)">
    <img src="${s.src}" style="object-position:${s.pos} 50%;${s.zoom ? `transform:scale(${s.zoom});transform-origin:50% 28%` : ''}">
    <div class="vf"></div>
    <div class="cam">${camIcon(s.live ? '#0a0d18' : '#e8ecf8')}Cam ${i + 1}</div>
    <div class="ok" style="width:${okSize}px;height:${okSize}px">${check(okSize)}</div>
    <div class="cap">${s.name}.webp</div></div>`;
}).join('')}</div>`;

const bar = `
  <div class="bar"><b>Camera Sweep</b>
    <div class="track"><i style="width:100%"></i></div>
    <div class="n">3 / 3 <span>· saved to UserData\\cap\\CameraSweep</span></div></div>`;

document.getElementById('root').innerHTML = `
  <div class="stage ${layout}">
    <div class="grid"></div><div class="glow c"></div><div class="glow p"></div>
    ${brand(D
      ? 'Shoot every camera in your <b>Honey Select 2 Studio</b> scene in one go, with every outfit, pose and expression you pick.'
      : 'Shoot every camera in your <b>Honey Select 2 Studio</b> scene<br>in one go: every outfit, pose and expression.')}
    ${prints}
    ${bar}
    ${by}
  </div>`;
</script>
</body>
</html>
